[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-classification-studio"
version = "0.1.0"
description = "Local video frame classification worker"
requires-python = ">=3.11"
dependencies = [
  "av>=14.0.0",
  "openai>=2.0.0,<3.0.0",
  "pillow>=10.0.0",
  "pydantic>=2.7.0,<3.0.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["video_classifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

